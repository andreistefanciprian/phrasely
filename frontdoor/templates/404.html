{{define "head"}}
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
  .number { font-family: 'Lora', Georgia, serif; font-size: clamp(5rem, 20vw, 9rem); font-weight: 600; color: var(--blue); line-height: 1; margin-bottom: 1.5rem; opacity: 0.15; }
  h1 { font-size: 1.25rem; font-weight: 600; color: var(--navy); margin-bottom: 0.5rem; }
  p { font-size: 0.95rem; color: var(--muted); margin-bottom: 2rem; }
  a { display: inline-block; padding: 0.7rem 1.75rem; background: var(--blue); color: var(--white); font-size: 0.875rem; font-weight: 600; border-radius: 100px; text-decoration: none; transition: opacity 0.15s; }
  a:hover { opacity: 0.88; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  body > * { animation: fadeUp 0.4s ease both; }
  h1 { animation-delay: 0.05s; }
  p  { animation-delay: 0.1s; }
  a  { animation-delay: 0.15s; }
</style>
{{end}}
