<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phrasely phrase choices</title>
  <style>
    :root {
      color-scheme: light dark;
      --navy: #0f1b6e;
      --blue: #5a54ff;
      --teal: #08aaa5;
      --definition: #7a80d4;
      --secondary: #6170b8;
      --muted: #7b82a9;
      --surface: #eeeeff;
      --white: #ffffff;
      --border: #dde1f5;
      --text: #2d3561;
      --success: #079b91;
      --error: #c24a4a;
      --shadow: 0 10px 30px rgba(15, 27, 110, 0.07);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 0;
      background: transparent;
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .widget {
      width: 100%;
      padding: 18px;
      background: var(--white);
    }

    .brand {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      display: block;
      width: 145px;
      height: 44px;
      flex: 0 0 auto;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(20px, 3.2vw, 27px);
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin: 7px 0 18px;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    .choice {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--white);
      box-shadow: 0 1px 0 rgba(15, 27, 110, 0.02);
    }

    .choice.recommended {
      border-color: rgba(90, 84, 255, 0.78);
      background: linear-gradient(110deg, rgba(238, 238, 255, 0.72), rgba(255, 255, 255, 0.96));
      box-shadow: var(--shadow);
    }

    .choice-copy { min-width: 0; }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      margin-bottom: 9px;
      padding: 4px 9px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(31, 211, 204, 0.13);
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recommended .label {
      background: rgba(90, 84, 255, 0.1);
      color: var(--blue);
    }

    .label-star { font-size: 12px; }

    .phrase {
      margin: 0;
      color: var(--navy);
      font-family: Lora, Georgia, "Times New Roman", serif;
      font-size: clamp(17px, 2.7vw, 21px);
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 12px;
    }

    .headwords {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: wrap;
      gap: 5px;
    }

    .headword {
      padding: 5px 9px;
      border-radius: 8px;
      background: rgba(90, 84, 255, 0.1);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .note {
      margin: 1px 0 0;
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.5;
    }

    .action {
      display: grid;
      justify-items: stretch;
      gap: 5px;
      width: 118px;
    }

    .save-button {
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid var(--blue);
      border-radius: 10px;
      background: var(--white);
      color: var(--blue);
      cursor: pointer;
      font-size: 14px;
      font-weight: 750;
      transition: background 150ms ease, color 150ms ease, transform 150ms ease, opacity 150ms ease;
    }

    .save-button:hover:not(:disabled) {
      background: var(--surface);
      transform: translateY(-1px);
    }

    .save-button:focus-visible {
      outline: 3px solid rgba(90, 84, 255, 0.24);
      outline-offset: 2px;
    }

    .save-button:disabled { cursor: default; }

    .save-button.pending { opacity: 0.65; }

    .save-button.saved {
      border-color: var(--success);
      background: rgba(31, 211, 204, 0.08);
      color: var(--success);
    }

    .status {
      min-height: 16px;
      color: var(--secondary);
      font-size: 10px;
      line-height: 1.35;
      text-align: center;
    }

    .status.error { color: var(--error); }

    .empty {
      padding: 26px 18px;
      border: 1px dashed var(--border);
      border-radius: 13px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 580px) {
      .widget { padding: 14px; }
      .choice {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 15px;
      }
      .meta { flex-direction: column; }
      .action { width: 100%; }
      .status { text-align: left; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --navy: #f0f1ff;
        --blue: #a9a6ff;
        --teal: #66e5df;
        --secondary: #b4b9e5;
        --muted: #969dc8;
        --surface: #262849;
        --white: #17182c;
        --border: #383b64;
        --text: #e4e6ff;
        --success: #66e5df;
        --error: #ffaaaa;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
      }
      .choice.recommended {
        background: linear-gradient(110deg, rgba(53, 52, 95, 0.9), rgba(23, 24, 44, 0.96));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .save-button { transition: none; }
    }
  </style>
</head>

    </div>

    <h1 id="title">Choose a phrase to save</h1>
    <p class="subtitle">Pick the context you’ll be most likely to remember.</p>
    <section id="choices" class="choices" aria-live="polite">
      <div class="empty">Preparing phrase choices…</div>
    </section>
  </main>

  <script>
    (() => {
      const choicesElement = document.getElementById("choices");
      const pendingRequests = new Map();
      let nextRequestId = 1;
      let latestChoices = [];
      let standardConnectionReady = false;
      let resizeObserver;
      let resizeFrame;
      let lastStandardWidth = 0;
      let lastStandardHeight = 0;
      let lastChatGPTHeight = 0;

      function send(message) {
        window.parent.postMessage(message, "*");
      }

      function notify(method, params = {}) {
        send({ jsonrpc: "2.0", method, params });
      }

      function request(method, params, timeoutMs = 20000) {
        const id = nextRequestId++;
        send({ jsonrpc: "2.0", id, method, params });
        return new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            pendingRequests.delete(id);
            reject(new Error("Phrasely did not respond. Please try again."));
          }, timeoutMs);
          pendingRequests.set(id, { resolve, reject, timeout });
        });
      }

      const standardConnection = request("ui/initialize", {
        protocolVersion: "2026-01-26",
        appInfo: { name: "phrasely-phrase-choices", version: "1.0.0" },
        appCapabilities: {}
      }, 5000).then((result) => {
        notify("ui/notifications/initialized");
        standardConnectionReady = true;
        scheduleSizeReport();
        return result;
      });

      function scheduleSizeReport() {
        if (resizeFrame !== undefined) return;
        resizeFrame = window.requestAnimationFrame(() => {
          resizeFrame = undefined;
          const html = document.documentElement;
          const originalHeight = html.style.height;
          html.style.height = "max-content";
          const height = Math.ceil(html.getBoundingClientRect().height);
          html.style.height = originalHeight;
          const width = Math.ceil(window.innerWidth);

          if (standardConnectionReady &&
              (width !== lastStandardWidth || height !== lastStandardHeight)) {
            lastStandardWidth = width;
            lastStandardHeight = height;
            notify("ui/notifications/size-changed", { width, height });
          }

          if (typeof window.openai?.notifyIntrinsicHeight === "function" &&
              height !== lastChatGPTHeight) {
            lastChatGPTHeight = height;
            window.openai.notifyIntrinsicHeight();
          }
        });
      }

      function startAutoResize() {
        if (typeof ResizeObserver === "function") {
          resizeObserver = new ResizeObserver(scheduleSizeReport);
          resizeObserver.observe(document.documentElement);
          resizeObserver.observe(document.body);
        }
        window.addEventListener("resize", scheduleSizeReport, { passive: true });
        scheduleSizeReport();
      }

      function stopAutoResize() {
        resizeObserver?.disconnect();
        resizeObserver = undefined;
        window.removeEventListener("resize", scheduleSizeReport);
        if (resizeFrame !== undefined) {
          window.cancelAnimationFrame(resizeFrame);
          resizeFrame = undefined;
        }
      }

      function normalizeChoices(result) {
        const raw = Array.isArray(result?.choices) ? result.choices : [];
        return raw.filter((choice) =>
          choice &&
          typeof choice.phrase === "string" &&
          choice.phrase.trim() !== "" &&
          Array.isArray(choice.headwords) &&
          choice.headwords.length > 0
        ).slice(0, 4);
      }

      function textElement(tag, className, text) {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = text;
        return element;
      }

      function saveArguments(choice) {
        return {
          phrase: choice.phrase,
          headwords: choice.headwords,
          note: typeof choice.note === "string" ? choice.note : "",
          source_urls: Array.isArray(choice.source_urls) ? choice.source_urls : []
        };
      }

      async function callAddPhrase(choice) {
        if (typeof window.openai?.callTool === "function") {
          return window.openai.callTool("add_phrase", saveArguments(choice));
        }

        try {
          await standardConnection;
          return await request("tools/call", {
            name: "add_phrase",
            arguments: saveArguments(choice)
          });
        } catch (standardError) {
          if (typeof window.openai?.callTool === "function") {
            return window.openai.callTool("add_phrase", saveArguments(choice));
          }
          throw standardError;
        }
      }

      function errorMessage(error) {
        if (typeof error?.message === "string" && error.message.trim() !== "") {
          return error.message;
        }
        return "Couldn’t save. Try again.";
      }

      function render(result) {
        const choices = normalizeChoices(result);
        if (choices.length === 0) return;
        latestChoices = choices;
        choicesElement.replaceChildren();

        choices.forEach((choice, index) => {
          const article = document.createElement("article");
          article.className = `choice${choice.recommended ? " recommended" : ""}`;

          const copy = document.createElement("div");
          copy.className = "choice-copy";

          const labelText = choice.recommended
            ? "Recommended"
            : (typeof choice.label === "string" && choice.label.trim() !== ""
              ? choice.label
              : `Option ${index + 1}`);
          const label = textElement("div", "label", labelText);
          if (choice.recommended) {
            label.prepend(textElement("span", "label-star", "★"));
          }
          copy.append(label);
          copy.append(textElement("p", "phrase", choice.phrase));

          const meta = document.createElement("div");
          meta.className = "meta";
          const headwords = document.createElement("div");
          headwords.className = "headwords";
          choice.headwords.forEach((headword) => {
            if (typeof headword === "string" && headword.trim() !== "") {
              headwords.append(textElement("span", "headword", headword));
            }
          });
          meta.append(headwords);
          if (typeof choice.note === "string" && choice.note.trim() !== "") {
            meta.append(textElement("p", "note", choice.note));
          }
          copy.append(meta);

          const action = document.createElement("div");
          action.className = "action";
          const button = textElement("button", "save-button", "♡ Save");
          button.type = "button";
          button.setAttribute("aria-label", `Save phrase ${index + 1} to Phrasely`);
          const status = textElement("div", "status", "");

          button.addEventListener("click", async () => {
            button.disabled = true;
            button.classList.add("pending");
            button.textContent = "Saving…";
            status.className = "status";
            status.textContent = "";

            try {
              const response = await callAddPhrase(choice);
              if (response?.isError) {
                throw new Error("Couldn’t save. Check your Phrasely connection and try again.");
              }
              button.className = "save-button saved";
              button.textContent = "✓ Saved";
              status.textContent = "Saved privately to Phrasely";
            } catch (error) {
              button.disabled = false;
              button.className = "save-button";
              button.textContent = "♡ Retry";
              status.className = "status error";
              status.textContent = errorMessage(error);
            }
          });

          action.append(button, status);
          article.append(copy, action);
          choicesElement.append(article);
        });
        scheduleSizeReport();
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.id !== undefined && pendingRequests.has(message.id)) {
          const pending = pendingRequests.get(message.id);
          pendingRequests.delete(message.id);
          window.clearTimeout(pending.timeout);
          if (message.error) pending.reject(message.error);
          else pending.resolve(message.result);
          return;
        }

        if (message.method === "ui/resource-teardown" && message.id !== undefined) {
          stopAutoResize();
          send({ jsonrpc: "2.0", id: message.id, result: {} });
          return;
        }

        if (message.method === "ui/notifications/tool-result") {
          const result = message.params?.structuredContent;
          if (Array.isArray(result?.choices)) render(result);
        }
      }, { passive: true });

      startAutoResize();

      if (Array.isArray(window.openai?.toolOutput?.choices)) {
        render(window.openai.toolOutput);
      }

      window.addEventListener("openai:set_globals", () => {
        if (latestChoices.length === 0 && Array.isArray(window.openai?.toolOutput?.choices)) {
          render(window.openai.toolOutput);
        }
        scheduleSizeReport();
      }, { passive: true });

      // Legacy ChatGPT hosts may not implement ui/initialize; keep the rejected
      // background promise from surfacing as an unhandled error in that case.
      standardConnection.catch(() => {});
    })();
  </script>
