<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phrasely phrase choices</title>
  <style>
    :root {
      color-scheme: light dark;
      --navy: #101b5c;
      --blue: #5856e8;
      --teal: #078f8b;
      --secondary: #626b94;
      --muted: #8188a6;
      --surface: #f7f7ff;
      --white: #ffffff;
      --border: #e3e5ef;
      --success: #087f76;
      --error: #b54747;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 0;
      background: transparent;
      color: var(--navy);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .widget {
      width: 100%;
      padding: 18px;
      background: var(--white);
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(20px, 3vw, 25px);
      line-height: 1.2;
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin: 6px 0 15px;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.45;
    }

    .choices {
      border-top: 1px solid var(--border);
    }

    .choice {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: center;
      padding: 17px 0;
      border-bottom: 1px solid var(--border);
    }

    .choice-copy { min-width: 0; }

    .choice-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
    }

    .recommended-marker {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--blue);
    }

    .recommended-marker::before {
      width: 3px;
      height: 3px;
      margin-right: 2px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .phrase {
      margin: 0;
      color: var(--navy);
      font-family: Lora, Georgia, "Times New Roman", serif;
      font-size: clamp(17px, 2.55vw, 20px);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 9px;
      margin-top: 9px;
      font-size: 12px;
      line-height: 1.45;
    }

    .headwords {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
    }

    .headword {
      color: var(--teal);
      font-weight: 700;
    }

    .note {
      display: flex;
      gap: 9px;
      margin: 0;
      color: var(--secondary);
    }

    .note::before {
      color: var(--border);
      content: "|";
    }

    .action {
      display: grid;
      justify-items: stretch;
      gap: 4px;
      width: 98px;
    }

    .save-button {
      min-height: 44px;
      padding: 9px 13px;
      border: 1px solid rgba(88, 86, 232, 0.7);
      border-radius: 10px;
      background: transparent;
      color: var(--blue);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: background 150ms ease, border-color 150ms ease, opacity 150ms ease;
    }

    .save-button:hover:not(:disabled) {
      border-color: var(--blue);
      background: var(--surface);
    }

    .save-button:focus-visible {
      outline: 3px solid rgba(88, 86, 232, 0.22);
      outline-offset: 2px;
    }

    .save-button:disabled { cursor: default; }
    .save-button.pending { opacity: 0.6; }

    .save-button.saved {
      border-color: var(--success);
      background: rgba(8, 127, 118, 0.07);
      color: var(--success);
    }

    .status {
      min-height: 14px;
      color: var(--secondary);
      font-size: 10px;
      line-height: 1.3;
      text-align: center;
    }

    .status.error { color: var(--error); }

    .empty {
      padding: 24px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 460px) {
      .widget { padding: 15px; }

      .choice {
        grid-template-columns: 1fr;
        gap: 11px;
        padding: 15px 0;
      }

      .action {
        justify-self: start;
        width: 98px;
      }

      .status { text-align: left; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --navy: #f0f1ff;
        --blue: #aaa8ff;
        --teal: #62d9d3;
        --secondary: #b4bad9;
        --muted: #969dbd;
        --surface: #272941;
        --white: #18192a;
        --border: #393b56;
        --success: #62d9d3;
        --error: #ffaaaa;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .save-button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="widget" aria-labelledby="title">
    <h1 id="title">Choose a phrase to save</h1>
    <p class="subtitle">Pick the context you’ll be most likely to remember.</p>
    <section id="choices" class="choices" aria-live="polite">
      <div class="empty">Preparing phrase choices…</div>
    </section>
  </main>

  <script>
    (() => {
      const choicesElement = document.getElementById("choices");
      const pendingRequests = new Map();
      let nextRequestId = 1;
      let latestChoices = [];
      let standardConnectionReady = false;
      let resizeObserver;
      let resizeFrame;
      let lastStandardWidth = 0;
      let lastStandardHeight = 0;
      let lastChatGPTHeight = 0;

      function send(message) {
        window.parent.postMessage(message, "*");
      }

      function notify(method, params = {}) {
        send({ jsonrpc: "2.0", method, params });
      }

      function request(method, params, timeoutMs = 20000) {
        const id = nextRequestId++;
        send({ jsonrpc: "2.0", id, method, params });
        return new Promise((resolve, reject) => {
          const timeout = window.setTimeout(() => {
            pendingRequests.delete(id);
            reject(new Error("Phrasely did not respond. Please try again."));
          }, timeoutMs);
          pendingRequests.set(id, { resolve, reject, timeout });
        });
      }

      const standardConnection = request("ui/initialize", {
        protocolVersion: "2026-01-26",
        // Identifies this embedded MCP Apps UI component to the host. It is
        // independent of Phrasely's plugin and server release versions.
        appInfo: { name: "phrasely-phrase-choices", version: "1.0.0" },
        appCapabilities: {}
      }, 5000).then((result) => {
        notify("ui/notifications/initialized");
        standardConnectionReady = true;
        scheduleSizeReport();
        return result;
      });

      function scheduleSizeReport() {
        if (resizeFrame !== undefined) return;
        resizeFrame = window.requestAnimationFrame(() => {
          resizeFrame = undefined;
          const html = document.documentElement;
          const originalHeight = html.style.height;
          html.style.height = "max-content";
          const height = Math.ceil(html.getBoundingClientRect().height);
          html.style.height = originalHeight;
          const width = Math.ceil(window.innerWidth);

          if (standardConnectionReady &&
              (width !== lastStandardWidth || height !== lastStandardHeight)) {
            lastStandardWidth = width;
            lastStandardHeight = height;
            notify("ui/notifications/size-changed", { width, height });
          }

          if (typeof window.openai?.notifyIntrinsicHeight === "function" &&
              height !== lastChatGPTHeight) {
            lastChatGPTHeight = height;
            window.openai.notifyIntrinsicHeight();
          }
        });
      }

      function startAutoResize() {
        if (typeof ResizeObserver === "function") {
          resizeObserver = new ResizeObserver(scheduleSizeReport);
          resizeObserver.observe(document.documentElement);
          resizeObserver.observe(document.body);
        }
        window.addEventListener("resize", scheduleSizeReport, { passive: true });
        scheduleSizeReport();
      }

      function stopAutoResize() {
        resizeObserver?.disconnect();
        resizeObserver = undefined;
        window.removeEventListener("resize", scheduleSizeReport);
        if (resizeFrame !== undefined) {
          window.cancelAnimationFrame(resizeFrame);
          resizeFrame = undefined;
        }
      }

      function normalizeChoices(result) {
        const raw = Array.isArray(result?.choices) ? result.choices : [];
        return raw.filter((choice) =>
          choice &&
          typeof choice.phrase === "string" &&
          choice.phrase.trim() !== "" &&
          Array.isArray(choice.headwords) &&
          choice.headwords.length > 0
        ).slice(0, 4);
      }

      function resultFromMetadata(metadata) {
        const results = [
          metadata?.mcp_tool_result,
          metadata?.call_tool_result
        ];

        for (const result of results) {
          if (Array.isArray(result?.structuredContent?.choices)) {
            return result.structuredContent;
          }
        }
        return undefined;
      }

      function persistChoices(choices) {
        if (typeof window.openai?.setWidgetState !== "function") return;

        // Cache the rendered snapshot for future mounts of this widget instance.
        const previous = window.openai.widgetState;
        const state = previous && typeof previous === "object" && !Array.isArray(previous)
          ? { ...previous, choices }
          : { choices };
        window.openai.setWidgetState(state);
      }

      function hydrateFromChatGPT() {
        // Reopened chats may expose retained globals without replaying the live
        // ui/notifications/tool-result event, so try each retained source.
        const sources = [
          window.openai?.toolOutput,
          resultFromMetadata(window.openai?.toolResponseMetadata),
          window.openai?.toolInput,
          window.openai?.widgetState
        ];

        for (const source of sources) {
          if (normalizeChoices(source).length > 0) {
            render(source);
            return true;
          }
        }
        return false;
      }

      function textElement(tag, className, text) {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = text;
        return element;
      }

      function saveArguments(choice) {
        return {
          phrase: choice.phrase,
          headwords: choice.headwords,
          note: typeof choice.note === "string" ? choice.note : "",
          source_urls: Array.isArray(choice.source_urls) ? choice.source_urls : []
        };
      }

      async function callAddPhrase(choice) {
        if (typeof window.openai?.callTool === "function") {
          return window.openai.callTool("add_phrase", saveArguments(choice));
        }

        try {
          await standardConnection;
          return await request("tools/call", {
            name: "add_phrase",
            arguments: saveArguments(choice)
          });
        } catch (standardError) {
          if (typeof window.openai?.callTool === "function") {
            return window.openai.callTool("add_phrase", saveArguments(choice));
          }
          throw standardError;
        }
      }

      function errorMessage(error) {
        if (typeof error?.message === "string" && error.message.trim() !== "") {
          return error.message;
        }
        return "Couldn’t save. Try again.";
      }

      function render(result) {
        const choices = normalizeChoices(result);
        if (choices.length === 0) return;
        latestChoices = choices;
        persistChoices(choices);
        choicesElement.replaceChildren();

        choices.forEach((choice, index) => {
          const article = document.createElement("article");
          article.className = `choice${choice.recommended ? " recommended" : ""}`;

          const copy = document.createElement("div");
          copy.className = "choice-copy";

          const heading = document.createElement("div");
          heading.className = "choice-heading";
          const labelText = typeof choice.label === "string" && choice.label.trim() !== ""
            ? choice.label
            : `Option ${index + 1}`;
          heading.append(textElement("span", "label", labelText));
          if (choice.recommended) {
            heading.append(textElement("span", "recommended-marker", "★ Recommended"));
          }
          copy.append(heading);
          copy.append(textElement("p", "phrase", choice.phrase));

          const meta = document.createElement("div");
          meta.className = "meta";
          const headwords = document.createElement("div");
          headwords.className = "headwords";
          choice.headwords.forEach((headword) => {
            if (typeof headword === "string" && headword.trim() !== "") {
              headwords.append(textElement("span", "headword", headword));
            }
          });
          meta.append(headwords);
          if (typeof choice.note === "string" && choice.note.trim() !== "") {
            meta.append(textElement("p", "note", choice.note));
          }
          copy.append(meta);

          const action = document.createElement("div");
          action.className = "action";
          const button = textElement("button", "save-button", "♡ Save");
          button.type = "button";
          button.setAttribute("aria-label", `Save phrase ${index + 1} to Phrasely`);
          const status = textElement("div", "status", "");

          button.addEventListener("click", async () => {
            button.disabled = true;
            button.classList.add("pending");
            button.textContent = "Saving…";
            status.className = "status";
            status.textContent = "";

            try {
              const response = await callAddPhrase(choice);
              if (response?.isError) {
                throw new Error("Couldn’t save. Check your Phrasely connection and try again.");
              }
              button.className = "save-button saved";
              button.textContent = "✓ Saved";
              status.textContent = "Saved privately to Phrasely";
            } catch (error) {
              button.disabled = false;
              button.className = "save-button";
              button.textContent = "♡ Retry";
              status.className = "status error";
              status.textContent = errorMessage(error);
            }
          });

          action.append(button, status);
          article.append(copy, action);
          choicesElement.append(article);
        });
        scheduleSizeReport();
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.id !== undefined && pendingRequests.has(message.id)) {
          const pending = pendingRequests.get(message.id);
          pendingRequests.delete(message.id);
          window.clearTimeout(pending.timeout);
          if (message.error) pending.reject(message.error);
          else pending.resolve(message.result);
          return;
        }

        if (message.method === "ui/resource-teardown" && message.id !== undefined) {
          stopAutoResize();
          send({ jsonrpc: "2.0", id: message.id, result: {} });
          return;
        }

        if (message.method === "ui/notifications/tool-result") {
          const result = message.params?.structuredContent;
          if (Array.isArray(result?.choices)) render(result);
        }
      }, { passive: true });

      startAutoResize();

      hydrateFromChatGPT();

      window.addEventListener("openai:set_globals", () => {
        if (latestChoices.length === 0) hydrateFromChatGPT();
        scheduleSizeReport();
      }, { passive: true });

      // Legacy ChatGPT hosts may not implement ui/initialize; keep the rejected
      // background promise from surfacing as an unhandled error in that case.
      standardConnection.catch(() => {});
    })();
  </script>
</body>
</html>
