<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in — Phrasely</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #0F1B6E; --muted: #9DA3CC; --teal: #1FD3CC; --white: #FFFFFF; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--white);
      color: var(--navy);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      padding: 1.5rem;
      text-align: center;
    }
    p { font-size: 0.95rem; color: var(--muted); }
    .error { color: #e53e3e; }
    a { color: var(--teal); text-decoration: none; font-size: 0.9rem; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <p id="msg">Signing you in…</p>
  <script>
    const API = 'http://localhost:8080';
    const token = new URLSearchParams(location.search).get('token');

    if (!token) {
      document.getElementById('msg').innerHTML =
        '<span class="error">Invalid link — no token found.</span><br><a href="/login.html">Back to login</a>';
    } else {
      fetch(`${API}/auth/verify?token=${encodeURIComponent(token)}`)
        .then(r => r.json())
        .then(data => {
          if (data.token) {
            localStorage.setItem('phrasely_token', data.token);
            location.href = '/index.html';
          } else {
            document.getElementById('msg').innerHTML =
              `<span class="error">${data.error || 'Invalid or expired link.'}</span><br><a href="/login.html">Back to login</a>`;
          }
        })
        .catch(() => {
          document.getElementById('msg').innerHTML =
            '<span class="error">Something went wrong.</span><br><a href="/login.html">Back to login</a>';
        });
    }
  </script>
</body>
</html>
