{{define "navbar"}}
<nav id="navbar" aria-label="Top navigation">
  <div id="navbar-inner">
    <div id="logo">
      <a href="/bubble"><img src="/static/logo.png" alt="Phrasely"></a>
    </div>
    <a href="/bubble"  class="nav-link{{if eq .Page "bubble"}} active{{end}}">Bubble</a>
    <a href="/shuffle"   class="nav-link{{if eq .Page "shuffle"}} active{{end}}">Shuffle</a>
    <a href="/phrases" class="nav-link{{if eq .Page "phrases"}} active{{end}}">Phrases</a>
    <a href="/add"     class="nav-link{{if eq .Page "add"}} active{{end}}">Add</a>
    <details id="account-menu">
      <summary aria-label="Open account menu">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9.5 5.5c-2.9 1.55-4.35 3.85-4.35 6.9 0 2.15 1.25 3.95 3.1 3.95 1.45 0 2.45-1.02 2.45-2.4 0-1.42-.95-2.35-2.25-2.35-.38 0-.74.07-1.07.2.18-1.78 1.25-3.18 3.22-4.2L9.5 5.5Z"/>
          <path d="M17.35 5.5C14.45 7.05 13 9.35 13 12.4c0 2.15 1.25 3.95 3.1 3.95 1.45 0 2.45-1.02 2.45-2.4 0-1.42-.95-2.35-2.25-2.35-.38 0-.74.07-1.07.2.18-1.78 1.25-3.18 3.22-4.2L17.35 5.5Z"/>
        </svg>
      </summary>
      <div id="account-menu-panel">
        <a href="/settings" class="menu-item{{if eq .Page "settings"}} active{{end}}">Settings</a>
        <a href="/story" class="menu-item">Our Story</a>
        <a href="/privacy" class="menu-item">Privacy</a>
        <form method="POST" action="/sign-out">
          <button class="menu-item menu-button" aria-label="Sign out">Sign out</button>
        </form>
      </div>
    </details>
  </div>
</nav>

<script>
  (() => {
    const menu = document.getElementById('account-menu');
    if (!menu) return;

    document.addEventListener('click', event => {
      if (menu.open && !menu.contains(event.target)) menu.open = false;
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') menu.open = false;
    });
  })();
</script>

<nav id="tab-bar" aria-label="Bottom navigation">
  <a href="/bubble"  class="tab{{if eq .Page "bubble"}} active{{end}}" aria-label="Bubble">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <circle cx="9"  cy="10" r="2"   fill="currentColor" stroke="none"/>
      <circle cx="15" cy="8"  r="1.5" fill="currentColor" stroke="none"/>
      <circle cx="15" cy="14" r="1"   fill="currentColor" stroke="none"/>
      <circle cx="9"  cy="15" r="1.2" fill="currentColor" stroke="none"/>
    </svg>
    <span>Bubble</span>
  </a>
  <a href="/phrases" class="tab{{if eq .Page "phrases"}} active{{end}}" aria-label="Phrases">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="8" y1="13" x2="16" y2="13"/>
      <line x1="8" y1="17" x2="16" y2="17"/>
    </svg>
    <span>Phrases</span>
  </a>
  <a href="/add" class="tab{{if eq .Page "add"}} active{{end}}" aria-label="Add phrase">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="16"/>
      <line x1="8"  y1="12" x2="16" y2="12"/>
    </svg>
    <span>Add</span>
  </a>
  <a href="/shuffle" class="tab{{if eq .Page "shuffle"}} active{{end}}" aria-label="Shuffle">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 3h5v5"/>
      <path d="M4 20L21 3"/>
      <path d="M3 7h5"/>
      <path d="M8 7l5 5"/>
      <path d="M16 21h5v-5"/>
      <path d="M21 21l-8-8"/>
    </svg>
    <span>Shuffle</span>
  </a>
</nav>
{{end}}
