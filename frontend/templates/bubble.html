{{define "title"}}Word Bubble — Phrasely{{end}}

{{define "head"}}
<meta name="robots" content="noindex">
<style>
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--white); }

  #bubble { position: fixed; top: 4.5rem; left: 0; right: 0; bottom: 0; }
  #bubble > .empty-state { position: absolute; top: 50%; left: 50%; width: 100%; padding: 0 1.5rem; transform: translate(-50%, -50%); }
  @media (max-width: 600px) { #bubble { top: 3.5rem; bottom: 4rem; } }

  .word {
    position: absolute;
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 500;
    white-space: nowrap;
    text-decoration: none;
    line-height: 1;
    opacity: 0;
    animation: appear 0.4s ease forwards;
    animation-fill-mode: both;
    transition: opacity 0.15s;
  }
  .word:hover { opacity: 0.5 !important; }
  @keyframes appear {
    from { opacity: 0; transform: scale(0.8); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
{{end}}

{{define "content"}}
<div id="bubble">
  {{if eq .Count 0}}<p class="empty-state">No phrases yet. <a href="/add">Add your first →</a></p>{{end}}
</div>

{{if ne .Count 0}}
<script>
  const phrases = {{.PhrasesJSON}};
  const headwordSeparator = ' · ';

  const palette = {
    high: ['#0F1B6E', '#1A2878'],
    mid:  ['#5A54FF', '#6F6BFF', '#1FD3CC'],
    low:  ['#7A80D4', '#9DA3CC', '#6ECFCB', '#6170B8'],
  };

  function pickColor(count, max) {
    if (count === 0) return '#D0D3EA';
    const t = count / max;
    const arr = t > 0.6 ? palette.high : t > 0.25 ? palette.mid : palette.low;
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function sizeRem(count, max) {
    if (count === 0) return 0.7;
    return 0.85 + (count / max) * 1.45;
  }

  function render() {
    const bubble = document.getElementById('bubble');
    bubble.innerHTML = '';

    const views = JSON.parse(localStorage.getItem('pf_views') || '{}');

    const seen = {};
    phrases.forEach(p => {
      const label = Array.isArray(p.headwords) ? p.headwords.join(headwordSeparator) : p.headwords;
      seen[label] = true;
    });

    const words = Object.keys(seen)
      .map(label => ({ label, count: views[label] || 0 }))
      .sort((a, b) => b.count - a.count);

    if (words.length === 0) {
      bubble.innerHTML = '<p class="empty-state">No phrases yet. <a href="/add">Add your first →</a></p>';
      return;
    }

    const max = Math.max(...words.map(w => w.count), 1);
    const navH = 72;
    const vw = window.innerWidth;
    const vh = window.innerHeight - navH;
    const pad = 14;

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    const placed = [];
    let delay = 0;

    function overlaps(x, w, y, h, p, gap) {
      return x < p.x + p.w + gap && x + w + gap > p.x &&
             y < p.y + p.h + gap && y + h + gap > p.y;
    }

    words.forEach(({ label, count }) => {
      const rem = sizeRem(count, max);
      const px = rem * 16;
      ctx.font = `500 ${px}px Inter, sans-serif`;
      const tw = ctx.measureText(label).width;
      const w = tw + pad;
      const h = px * 1.5;

      let pos = null;

      for (let attempt = 0; attempt < 400; attempt++) {
        const x = pad + Math.random() * (vw - w - pad * 2);
        const y = pad + Math.random() * (vh - h - pad * 2);
        if (!placed.some(p => overlaps(x, w, y, h, p, pad))) { pos = { x, y, w, h }; break; }
      }

      if (!pos) {
        for (let attempt = 0; attempt < 300; attempt++) {
          const x = 2 + Math.random() * (vw - w - 4);
          const y = 2 + Math.random() * (vh - h - 4);
          if (!placed.some(p => overlaps(x, w, y, h, p, 2))) { pos = { x, y, w, h }; break; }
        }
      }

      if (!pos) return;
      placed.push(pos);

      const el = document.createElement('a');
      el.textContent = label;
      el.className = 'word';
      el.href = `/shuffle?q=${encodeURIComponent(label)}`;
      el.style.left = pos.x + 'px';
      el.style.top  = pos.y + 'px';
      el.style.fontSize = rem + 'rem';
      el.style.color = pickColor(count, max);
      el.style.animationDelay = delay + 'ms';
      bubble.appendChild(el);
      delay += 8;
    });
  }

  render();

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 200);
  });
</script>
{{end}}
{{end}}
