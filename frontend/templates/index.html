{{define "title"}}Phrasely{{end}}

{{define "head"}}
<meta name="robots" content="noindex">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6.5rem 1.5rem 5rem; }

  #phrase { font-family: 'Lora', Georgia, serif; font-size: clamp(1.25rem, 4vw, 1.65rem); line-height: 1.85; text-align: center; max-width: 600px; color: var(--navy); animation: fadeUp 0.35s ease; }
  #phrase .def { font-style: italic; color: var(--definition); }

  #keyword { margin-top: 2rem; display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; animation: fadeUp 0.35s ease; }
  #keyword a { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy); text-decoration: none; border-bottom: 1px solid var(--teal); padding-bottom: 1px; transition: color 0.15s, border-color 0.15s; }
  #keyword a:hover { color: var(--blue); border-color: var(--blue); }

  #note { margin: 0.6rem auto 0; font-size: 0.9rem; line-height: 1.6; color: var(--secondary); text-align: center; width: 100%; max-width: 480px; animation: fadeUp 0.35s ease; }

  #siblings { margin-top: 2.5rem; max-width: 600px; width: 100%; animation: fadeUp 0.35s ease; }
  #siblings:empty { display: none; }
  .siblings-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); text-align: center; margin-bottom: 1.25rem; }
  .sibling-phrase { font-family: 'Lora', Georgia, serif; font-size: clamp(1rem, 3vw, 1.2rem); line-height: 1.8; text-align: center; color: var(--secondary); padding: 1rem 0; border-top: 1px solid var(--surface); }
  .sibling-phrase .def { font-style: italic; color: var(--definition); }

  #main-content { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #tap-hint { display: none; margin-top: 2.5rem; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--muted); text-align: center; text-transform: uppercase; }
  @media (hover: none) { #tap-hint { display: block; } }
  @media (max-width: 600px) { body { padding: 5rem 1.25rem 4rem; } .search-result { padding: 1rem 0; } #siblings { margin-top: 2rem; } }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
{{end}}

{{define "content"}}
<div id="main-content">
  <p id="phrase"></p>
  <div id="keyword"></div>
  <p id="note"></p>
  <div id="siblings"></div>
  <p id="tap-hint">Tap to shuffle</p>
</div>

<script>
  const phrases = {{.PhrasesJSON}};

  function escapeHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                   .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function format(text) {
    return escapeHtml(text).replace(/\(([^)]+)\)/g, '<span class="def">($1)</span>');
  }

  function show(item) {
    item = item || phrases[Math.floor(Math.random() * phrases.length)];
    if (!item) return;

    const phraseEl   = document.getElementById('phrase');
    const keywordEl  = document.getElementById('keyword');
    const noteEl     = document.getElementById('note');
    const siblingsEl = document.getElementById('siblings');

    [phraseEl, keywordEl, noteEl, siblingsEl].forEach(el => {
      el.style.animation = 'none'; el.offsetHeight; el.style.animation = '';
    });

    phraseEl.innerHTML = format(item.phrase);

    const headwords  = item.headwords || [];
    const sourceUrls = item.source_urls || [];
    keywordEl.textContent = '';
    headwords.forEach((w, i) => {
      if (i > 0) {
        const sep = document.createElement('span');
        sep.textContent = ' vs ';
        sep.style.cssText = 'color:var(--muted);font-size:0.7rem;letter-spacing:0.08em';
        keywordEl.appendChild(sep);
      }
      const a = document.createElement('a');
      a.textContent = w;
      const fallback = `https://www.merriam-webster.com/dictionary/${encodeURIComponent(w)}`;
      const candidate = sourceUrls[i] || fallback;
      let href = fallback;
      try {
        const u = new URL(candidate, location.origin);
        if (u.protocol === 'http:' || u.protocol === 'https:') href = u.toString();
      } catch {}
      a.href = href; a.target = '_blank'; a.rel = 'noopener';
      keywordEl.appendChild(a);
    });

    noteEl.textContent = item.note;

    const label = headwords.join(' vs ');
    const siblings = phrases.filter(p => (p.headwords || []).join(' vs ') === label && p.phrase !== item.phrase);
    siblingsEl.innerHTML = siblings.length > 0
      ? `<div class="siblings-label">Also with this headword</div>` +
        siblings.map(s => `<div class="sibling-phrase">${format(s.phrase)}</div>`).join('')
      : '';

    const views = JSON.parse(localStorage.getItem('pf_views') || '{}');
    views[label] = (views[label] || 0) + 1;
    localStorage.setItem('pf_views', JSON.stringify(views));
  }

  // Initialise from URL params
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const q  = params.get('q');

  if (id) {
    const item = phrases.find(p => p.id === id);
    show(item || phrases[Math.floor(Math.random() * phrases.length)]);
  } else if (q) {
    const matches = phrases.filter(p => (p.headwords || []).some(w => w.toLowerCase() === q.toLowerCase()));
    show(matches.length > 0 ? matches[Math.floor(Math.random() * matches.length)] : phrases[Math.floor(Math.random() * phrases.length)]);
  } else {
    show();
  }

  document.getElementById('main-content').addEventListener('click', e => {
    if (e.target.tagName === 'A') return;
    show();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      e.preventDefault(); show();
    }
  });
</script>
{{end}}
