{{define "title"}}Phrasely{{end}}

{{define "head"}}
<meta name="robots" content="noindex">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6.5rem 1.5rem 5rem; }
  body:has(#shuffle-stage) { justify-content: flex-start; }

  #shuffle-stage { display: grid; justify-items: center; width: 100%; padding-top: min(15dvh, 7rem); }

  #phrase { font-family: 'Lora', Georgia, serif; font-size: clamp(1.25rem, 4vw, 1.65rem); line-height: 1.85; text-align: center; max-width: 600px; color: var(--navy); animation: fadeUp 0.35s ease; }
  #phrase .def { font-style: italic; color: var(--definition); }

  #keyword { margin-top: 2rem; display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; animation: fadeUp 0.35s ease; }
  #keyword .headword { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--navy); text-decoration: none; border-bottom: 1px solid var(--teal); padding-bottom: 1px; transition: color 0.15s, border-color 0.15s; }
  #keyword a:hover { color: var(--blue); border-color: var(--blue); }

  #note { margin: 0.6rem auto 0; font-size: 0.9rem; line-height: 1.6; color: var(--secondary); text-align: center; width: 100%; max-width: 480px; animation: fadeUp 0.35s ease; }

  #siblings { margin-top: 2.5rem; max-width: 600px; width: 100%; animation: fadeUp 0.35s ease; }
  #siblings:empty { display: none; }
  #related { margin-top: 2.5rem; max-width: 600px; width: 100%; }
  #related:empty { display: none; }

  .siblings-label, .related-label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); text-align: center; margin-bottom: 1.25rem; }
  .sibling-phrase, .related-phrase { font-family: 'Lora', Georgia, serif; font-size: clamp(1rem, 3vw, 1.2rem); line-height: 1.8; text-align: center; color: var(--secondary); padding: 1rem 0; border-top: 1px solid var(--surface); text-decoration: none; display: block; transition: color 0.15s; }
  .sibling-phrase:hover, .related-phrase:hover { color: var(--navy); }
  .sibling-phrase .def, .related-phrase .def { font-style: italic; color: var(--definition); }

  #main-content { width: 100%; max-width: 600px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .shuffle-hint { margin-bottom: 2rem; min-height: 34px; align-items: center; justify-content: center; gap: 12px; color: var(--muted); text-align: center; text-transform: uppercase; display: none; }
  .shuffle-prompt { font-size: 0.72rem; letter-spacing: 0.08em; }
  .shuffle-divider { width: 1px; height: 11px; background: var(--border); }
  .listen-button { min-height: 34px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: inherit; cursor: pointer; transition: color 0.15s, background-color 0.15s; }
  .listen-button:hover, .listen-button:focus-visible { color: var(--navy); background: var(--surface); outline: 2px solid var(--blue); outline-offset: 2px; }
  .listen-button svg { width: 22px; height: 20px; flex: none; }
  .listen-button-label { width: 52px; font-size: 11px; letter-spacing: 0.16em; line-height: 1; text-align: left; white-space: nowrap; }
  .listen-button[data-state="loading"] { color: #9DA3CC; }
  .listen-button[data-state="speaking"] { color: #1FD3CC; }
  .listen-button[data-state="loading"] .speaker-arc, .listen-button[data-state="speaking"] .speaker-arc { animation: speakerPulse 1.4s ease-in-out infinite; }
  .listen-button[data-state="loading"] .speaker-arc-far { animation-delay: 0.5s; }
  .listen-button[data-state="speaking"] .speaker-arc { animation-duration: 0.9s; }
  .listen-button[data-state="speaking"] .speaker-arc-far { animation-delay: 0.3s; }
  .audio-error { min-height: 1.4em; margin: -1.35rem 0 1rem; color: var(--secondary); font-size: 0.78rem; text-align: center; }
  .audio-error:empty { visibility: hidden; }
  :root[data-theme="dark"] .listen-button {
    color: #9299BB;
  }
  :root[data-theme="dark"] .listen-button:hover, :root[data-theme="dark"] .listen-button:focus-visible { color: #F4F5FF; background: #20264A; }
  :root[data-theme="dark"] .listen-button[data-state="loading"] { color: #555E96; }
  :root[data-theme="dark"] .listen-button[data-state="speaking"] { color: #56DDD6; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .listen-button { color: #9299BB; }
    :root:not([data-theme="light"]) .listen-button:hover, :root:not([data-theme="light"]) .listen-button:focus-visible { color: #F4F5FF; background: #20264A; }
    :root:not([data-theme="light"]) .listen-button[data-state="loading"] { color: #555E96; }
    :root:not([data-theme="light"]) .listen-button[data-state="speaking"] { color: #56DDD6; }
  }
  @media (hover: hover) { #click-hint { display: flex; } }
  @media (hover: none)  { #tap-hint  { display: flex; } }
  @media (hover: none), (pointer: coarse) { .listen-button { min-height: 44px; } }
  @media (max-width: 600px) { body { padding: 5rem 1.25rem 4rem; } #shuffle-stage { padding-top: min(8dvh, 3rem); } #siblings { margin-top: 2rem; } #related { margin-top: 2rem; } }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes speakerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  @media (prefers-reduced-motion: reduce) { .listen-button .speaker-arc { animation: none !important; } }
</style>
{{end}}

{{define "content"}}
{{if eq .Count 0}}
<p class="empty-state">No phrases yet. <a href="/add">Add your first →</a></p>
{{else}}
<div id="shuffle-stage">
  <div id="main-content">
    <div class="shuffle-hint" id="click-hint"><span class="shuffle-prompt">Click to shuffle</span><span class="shuffle-divider" aria-hidden="true"></span>{{template "listen-button" "click"}}</div>
    <div class="shuffle-hint" id="tap-hint"><span class="shuffle-prompt">Tap to shuffle</span><span class="shuffle-divider" aria-hidden="true"></span>{{template "listen-button" "tap"}}</div>
    <p class="audio-error" id="audio-error" role="status"></p>
    <audio id="phrase-audio" preload="none"></audio>
    <p id="phrase"></p>
    <div id="keyword"></div>
    <p id="note"></p>
    <div id="siblings"></div>
  </div>
</div>
<div id="related"></div>

<script src="/static/headwords.js"></script>
<script>
  const phrases = {{.PhrasesJSON}};
  const headwordSeparator = ' · ';
  let relatedRequest = 0;
  let currentPhraseID = '';
  let audioRequest = 0;
  let audioState = 'rest';
  const phraseAudio = document.getElementById('phrase-audio');
  const listenButtons = [...document.querySelectorAll('.listen-button')];
  const audioError = document.getElementById('audio-error');

  function setAudioState(state) {
    audioState = state;
    const label = state === 'loading' ? 'LOADING' : state === 'speaking' ? 'STOP' : 'LISTEN';
    listenButtons.forEach(button => {
      button.dataset.state = state;
      button.querySelector('.listen-button-label').textContent = label;
      button.setAttribute('aria-label', state === 'speaking' ? 'Stop phrase audio' : 'Hear the phrase');
      if (state === 'loading') button.setAttribute('aria-busy', 'true');
      else button.removeAttribute('aria-busy');
    });
  }

  function stopAudio() {
    audioRequest++;
    phraseAudio.pause();
    phraseAudio.currentTime = 0;
    phraseAudio.removeAttribute('src');
    setAudioState('rest');
  }

  function showAudioError() {
    stopAudio();
    audioError.textContent = "Couldn't play this phrase. Try again.";
  }

  async function toggleAudio() {
    audioError.textContent = '';
    if (audioState === 'speaking') { stopAudio(); return; }
    if (audioState === 'loading' || !currentPhraseID) return;

    const request = ++audioRequest;
    setAudioState('loading');
    phraseAudio.src = `/fd/phrases/${encodeURIComponent(currentPhraseID)}/audio`;
    try {
      await phraseAudio.play();
      if (request !== audioRequest) { phraseAudio.pause(); return; }
      setAudioState('speaking');
    } catch (err) {
      if (request === audioRequest) showAudioError();
    }
  }

  listenButtons.forEach(button => button.addEventListener('click', toggleAudio));
  phraseAudio.addEventListener('ended', () => { if (audioState === 'speaking') stopAudio(); });
  phraseAudio.addEventListener('error', () => { if (audioState !== 'rest') showAudioError(); });

  function escapeHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                   .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function format(text) {
    return PhraselyHeadwords.format(text.phrase, text.headwords);
  }

  function show(item) {
    item = item || phrases[Math.floor(Math.random() * phrases.length)];
    if (!item) return;

    stopAudio();
    audioError.textContent = '';
    currentPhraseID = item.id;

    const phraseEl   = document.getElementById('phrase');
    const keywordEl  = document.getElementById('keyword');
    const noteEl     = document.getElementById('note');
    const siblingsEl = document.getElementById('siblings');

    [phraseEl, keywordEl, noteEl, siblingsEl].forEach(el => {
      el.style.animation = 'none'; el.offsetHeight; el.style.animation = '';
    });

    phraseEl.innerHTML = format(item);

    const headwords  = item.headwords || [];
    keywordEl.textContent = '';
    headwords.forEach((w, i) => {
      if (i > 0) {
        const sep = document.createElement('span');
        sep.textContent = headwordSeparator;
        sep.style.cssText = 'color:var(--muted);font-size:0.7rem;letter-spacing:0.08em';
        keywordEl.appendChild(sep);
      }
      const a = document.createElement(w.source_url ? 'a' : 'span');
      a.className = 'headword';
      a.textContent = w.canonical;
      if (w.source_url) {
        try {
          const u = new URL(w.source_url);
          if (u.protocol === 'http:' || u.protocol === 'https:') {
            a.href = u.toString(); a.target = '_blank'; a.rel = 'noopener';
          }
        } catch {}
      }
      keywordEl.appendChild(a);
    });

    noteEl.textContent = item.note;

    const label = PhraselyHeadwords.key(headwords);
    const siblings = phrases.filter(p => PhraselyHeadwords.key(p.headwords) === label && p.id !== item.id);
    siblingsEl.innerHTML = siblings.length > 0
      ? `<div class="siblings-label">Also with this headword</div>` +
        siblings.map(s => `<a class="sibling-phrase" href="/shuffle?id=${escapeHtml(s.id)}" data-phrase-id="${escapeHtml(s.id)}">${format(s)}</a>`).join('')
      : '';

    fetchRelated(item.id, label);

    const views = JSON.parse(localStorage.getItem('pf_views') || '{}');
    views[label] = (views[label] || 0) + 1;
    localStorage.setItem('pf_views', JSON.stringify(views));
  }

  function showById(id) {
    const item = phrases.find(p => p.id === id);
    if (!item) return;
    history.pushState({}, '', `/shuffle?id=${encodeURIComponent(id)}`);
    show(item);
  }

  async function fetchRelated(phraseId, siblingLabel) {
    const relatedEl = document.getElementById('related');
    const request = ++relatedRequest;
    relatedEl.innerHTML = '';
    try {
      const res = await fetch(`/fd/phrases/${phraseId}/related?limit=5`);
      if (request !== relatedRequest) return;
      if (!res.ok) return;
      const items = await res.json();
      if (request !== relatedRequest) return;
      if (!items || items.length === 0) return;
      const filtered = items.filter(p => PhraselyHeadwords.key(p.headwords) !== siblingLabel);
      if (filtered.length === 0) return;
      relatedEl.innerHTML =
        `<div class="related-label">You may also like</div>` +
        filtered.map(p => `<a class="related-phrase" href="/shuffle?id=${escapeHtml(p.id)}" data-phrase-id="${escapeHtml(p.id)}">${format(p)}</a>`).join('');
    } catch (err) { console.error('fetchRelated', err); }
  }

  // Initialise from URL params
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const q  = params.get('q');

  if (id) {
    const item = phrases.find(p => p.id === id);
    show(item || phrases[Math.floor(Math.random() * phrases.length)]);
  } else if (q) {
    const normalizedQuery = q.toLowerCase();
    const matches = phrases.filter(p => {
      const headwords = p.headwords || [];
      return PhraselyHeadwords.key(headwords).toLowerCase() === normalizedQuery;
    });
    show(matches.length > 0 ? matches[Math.floor(Math.random() * matches.length)] : phrases[Math.floor(Math.random() * phrases.length)]);
  } else {
    show();
  }

  document.getElementById('main-content').addEventListener('click', e => {
    if (e.target.closest('.listen-button')) return;
    const phraseLink = e.target.closest('[data-phrase-id]');
    if (phraseLink) { e.preventDefault(); showById(phraseLink.dataset.phraseId); return; }
    if (e.target.closest('a')) return;
    show();
  });

  document.getElementById('related').addEventListener('click', e => {
    const phraseLink = e.target.closest('[data-phrase-id]');
    if (phraseLink) { e.preventDefault(); showById(phraseLink.dataset.phraseId); }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') {
      if (document.activeElement?.closest('a, button')) return;
      e.preventDefault();
      show();
    }
  });
</script>
{{end}}
{{end}}

{{define "listen-button"}}
<button class="listen-button" type="button" data-state="rest" aria-label="Hear the phrase">
  <svg viewBox="0 0 22 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 8h3l4-3.5v11l-4-3.5h-3z"></path>
    <path class="speaker-arc" d="M13 7a4 4 0 0 1 0 6"></path>
    <path class="speaker-arc speaker-arc-far" d="M16 4.5a7.5 7.5 0 0 1 0 11"></path>
  </svg>
  <span class="listen-button-label">LISTEN</span>
</button>
{{end}}
