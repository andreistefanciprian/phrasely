server {
    listen 80;

    root /usr/share/nginx/html;
    index login.html;

    location = / {
        try_files /home.html =404;
    }

    # Magic link verify route — maps /auth/verify?token=... to auth-verify.html
    location = /auth/verify {
        try_files /auth-verify.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
