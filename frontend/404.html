<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Phrasely</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0F1B6E;
      --blue: #5A54FF;
      --teal: #1FD3CC;
      --muted: #9DA3CC;
      --white: #FFFFFF;
      --border: #DDE1F5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--white);
      color: var(--navy);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .number {
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 600;
      color: var(--blue);
      line-height: 1;
      margin-bottom: 1.5rem;
      opacity: 0.15;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    a {
      display: inline-block;
      padding: 0.7rem 1.75rem;
      background: var(--blue);
      color: var(--white);
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 100px;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    a:hover { opacity: 0.88; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    body > * { animation: fadeUp 0.4s ease both; }
    h1 { animation-delay: 0.05s; }
    p  { animation-delay: 0.1s; }
    a  { animation-delay: 0.15s; }
  </style>
</head>
<body>
  <div class="number">404</div>
  <h1>Page not found</h1>
  <p>This page doesn't exist — but your phrases do.</p>
  <a href="/">Go home</a>
</body>
</html>
