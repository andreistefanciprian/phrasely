<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phrasely</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="navbar.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--white);
      color: var(--navy);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6.5rem 1.5rem 5rem;
    }

    #phrase {
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(1.25rem, 4vw, 1.65rem);
      line-height: 1.85;
      text-align: center;
      max-width: 600px;
      color: var(--navy);
      animation: fadeUp 0.35s ease;
    }

    #phrase .def {
      font-style: italic;
      color: var(--definition);
    }

    #keyword {
      margin-top: 2rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 0.35s ease;
    }

    #keyword a {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--navy);
      text-decoration: none;
      border-bottom: 1px solid var(--teal);
      padding-bottom: 1px;
      transition: color 0.15s, border-color 0.15s;
    }

    #keyword a:hover {
      color: var(--blue);
      border-color: var(--blue);
    }

    #note {
      margin: 0.6rem auto 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--secondary);
      text-align: center;
      width: 100%;
      max-width: 480px;
      animation: fadeUp 0.35s ease;
    }

    #siblings {
      margin-top: 2.5rem;
      max-width: 600px;
      width: 100%;
      animation: fadeUp 0.35s ease;
    }

    #siblings:empty { display: none; }

    .siblings-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--teal);
      text-align: center;
      margin-bottom: 1.25rem;
    }

    .sibling-phrase {
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.8;
      text-align: center;
      color: var(--secondary);
      padding: 1rem 0;
      border-top: 1px solid var(--surface);
    }

    .sibling-phrase .def {
      font-style: italic;
      color: var(--definition);
    }

    #search-results {
      display: none;
      max-width: 600px;
      width: 100%;
      animation: fadeUp 0.2s ease;
    }

    .search-count {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .search-result {
      padding: 1.25rem 0;
      border-top: 1px solid var(--surface);
      cursor: pointer;
      text-align: center;
      transition: opacity 0.15s;
    }

    .search-result:hover { opacity: 0.6; }

    .search-result-phrase {
      font-family: 'Lora', Georgia, serif;
      font-size: clamp(1rem, 3vw, 1.2rem);
      line-height: 1.8;
      color: var(--navy);
    }

    .search-result-phrase .def {
      font-style: italic;
      color: var(--definition);
    }

    .search-result-meta {
      margin-top: 0.4rem;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .search-result-note {
      margin-top: 0.3rem;
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--secondary);
    }

    .search-empty {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      padding: 2rem 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #main-content {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Subtle hint visible only on touch devices */
    #tap-hint {
      display: none;
      margin-top: 2.5rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
    }

    @media (hover: none) {
      #tap-hint { display: block; }
    }

    @media (max-width: 600px) {
      body { padding: 5rem 1.25rem 4rem; }
      .search-result { padding: 1rem 0; }
      #siblings { margin-top: 2rem; }
    }
  </style>
</head>
<body>
<script src="navbar.js"></script>

  <div id="main-content">
    <p id="phrase"></p>
    <p id="keyword"></p>
    <p id="note"></p>
    <div id="siblings"></div>
    <p id="tap-hint">Tap to shuffle</p>
  </div>
  <div id="search-results"></div>

  <script>

    let phrases = [];

    async function load() {
      const token = localStorage.getItem('phrasely_token');
      const res = await fetch(`/api/v1/phrases`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) { location.href = 'login.html'; return; }
      phrases = await res.json();

      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const q  = params.get('q');

      if (id) {
        // Show a specific phrase by ID (e.g. after saving from add.html)
        const item = phrases.find(p => p.id === id);
        show(item || phrases[Math.floor(Math.random() * phrases.length)]);
      } else if (q) {
        document.getElementById('search-input').value = q;
        onSearch(q);
      } else {
        show();
      }
    }

    function show(item) {
      item = item || phrases[Math.floor(Math.random() * phrases.length)];
      if (!item) return;

      const mainEl = document.getElementById('main-content');
      const resultsEl = document.getElementById('search-results');
      document.getElementById('search-input').value = '';
      mainEl.style.display = '';
      resultsEl.style.display = 'none';

      const phraseEl  = document.getElementById('phrase');
      const keywordEl = document.getElementById('keyword');
      const noteEl    = document.getElementById('note');
      const siblingsEl = document.getElementById('siblings');

      [phraseEl, keywordEl, noteEl, siblingsEl].forEach(el => {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = '';
      });

      phraseEl.innerHTML = format(item.phrase);

      // Build keyword links using DOM nodes — never innerHTML — so headwords and
      // source_urls (user-editable) cannot inject markup or javascript: URLs.
      const headwords = item.headwords || [];
      const sourceUrls = item.source_urls || [];
      keywordEl.textContent = '';
      headwords.forEach((w, i) => {
        if (i > 0) {
          const sep = document.createElement('span');
          sep.textContent = ' vs ';
          sep.style.cssText = 'color:var(--muted);font-size:0.7rem;letter-spacing:0.08em';
          keywordEl.appendChild(sep);
        }
        const a = document.createElement('a');
        a.textContent = w;
        const fallback = `https://www.merriam-webster.com/dictionary/${encodeURIComponent(w)}`;
        const candidate = sourceUrls[i] || fallback;
        let href = fallback;
        try {
          const u = new URL(candidate, location.origin);
          if (u.protocol === 'http:' || u.protocol === 'https:') href = u.toString();
        } catch {}
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener';
        keywordEl.appendChild(a);
      });

      noteEl.textContent = item.note;

      // Siblings: other phrases sharing the same headword label
      const label = headwords.join(' vs ');
      const siblings = phrases.filter(p =>
        (p.headwords || []).join(' vs ') === label && p.phrase !== item.phrase
      );
      siblingsEl.innerHTML = siblings.length > 0
        ? `<div class="siblings-label">Also with this headword</div>` +
          siblings.map(s => `<div class="sibling-phrase">${format(s.phrase)}</div>`).join('')
        : '';

      // Track views in localStorage
      const views = JSON.parse(localStorage.getItem('pf_views') || '{}');
      views[label] = (views[label] || 0) + 1;
      localStorage.setItem('pf_views', JSON.stringify(views));
    }

    function onSearch(query) {
      const q = query.trim().toLowerCase();
      const mainEl = document.getElementById('main-content');
      const resultsEl = document.getElementById('search-results');

      if (!q) {
        mainEl.style.display = '';
        resultsEl.style.display = 'none';
        return;
      }

      mainEl.style.display = 'none';
      resultsEl.style.display = 'block';

      const matches = phrases.filter(p => {
        const hw = (p.headwords || []);
        return p.phrase.toLowerCase().includes(q) ||
          hw.join(' vs ').toLowerCase().includes(q) ||
          hw.join(' ').toLowerCase().includes(q) ||
          hw.some(w => w.toLowerCase().includes(q)) ||
          p.note.toLowerCase().includes(q);
      });

      // If the query exactly matches a headword label (i.e. came from a bubble click),
      // increment its view count so the bubble font grows on next visit.
      const exactMatch = phrases.find(p =>
        (p.headwords || []).join(' vs ').toLowerCase() === q
      );
      if (exactMatch) {
        const label = (exactMatch.headwords || []).join(' vs ');
        const views = JSON.parse(localStorage.getItem('pf_views') || '{}');
        views[label] = (views[label] || 0) + 1;
        localStorage.setItem('pf_views', JSON.stringify(views));
      }

      if (matches.length === 0) {
        resultsEl.innerHTML = '<div class="search-empty">No phrases found.</div>';
        return;
      }

      resultsEl.innerHTML =
        `<div class="search-count">${matches.length} result${matches.length !== 1 ? 's' : ''}</div>` +
        matches.map(p =>
          `<div class="search-result" onclick="show(phrases[${phrases.indexOf(p)}])">
            <div class="search-result-phrase">${format(p.phrase)}</div>
            <div class="search-result-meta">${escapeHtml((p.headwords || []).join(' vs '))}</div>
            <div class="search-result-note">${escapeHtml(p.note || '')}</div>
          </div>`
        ).join('');
    }

    function escapeHtml(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                     .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function format(text) {
      return escapeHtml(text).replace(/\(([^)]+)\)/g, '<span class="def">($1)</span>');
    }

    function next() { show(); }

    // Tap anywhere on the phrase to shuffle — but not on links (MW links)
    document.getElementById('main-content').addEventListener('click', e => {
      if (e.target.tagName === 'A') return;
      show();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const searchEl = document.getElementById('search-input');
        searchEl.value = '';
        onSearch('');
        searchEl.blur();
      }
      if ((e.key === 'ArrowRight' || e.key === ' ') && document.activeElement.id !== 'search-input') {
        e.preventDefault();
        show();
      }
    });

    load();
  </script>

</body>
</html>
