services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://phrasely:phrasely@db:5432/phrasely?sslmode=disable
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phrasely
      POSTGRES_USER: phrasely
      POSTGRES_PASSWORD: phrasely
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phrasely"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
