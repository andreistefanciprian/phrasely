services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://phrasely:phrasely@db:5432/phrasely?sslmode=disable
      PORT: "8080"
      BASE_URL: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phrasely
      POSTGRES_USER: phrasely
      POSTGRES_PASSWORD: phrasely
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phrasely"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
