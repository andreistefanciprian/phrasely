services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://phrasezzly:phrasezzly@db:5432/phrasezzly?sslmode=disable
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phrasezzly
      POSTGRES_USER: phrasezzly
      POSTGRES_PASSWORD: phrasezzly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phrasezzly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
