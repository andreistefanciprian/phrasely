services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      API_HOST: http://api:8080
    depends_on:
      - api

  mcp:
    build: ./mcp
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      API_HOST: http://api:8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Public URLs used in OAuth discovery documents.
      # MCP_BASE_URL: the URL ChatGPT uses to reach this server (issuer, token endpoint, register endpoint).
      # FRONTEND_BASE_URL: the URL of the consent screen (/authorize lives on the frontend).
      # Override these in prod with the real public HTTPS URLs.
      MCP_BASE_URL: http://localhost:8081
      FRONTEND_BASE_URL: http://localhost:3000
    depends_on:
      - api

  api:
    build: ./backend
    # Port only exposed for scripts/api.sh direct access in local dev.
    # In production the API is private — all browser traffic routes through frontend.
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://phrasely:phrasely@db:5432/phrasely?sslmode=disable
      PORT: "8080"
      BASE_URL: http://localhost:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      MAGIC_LINK_TTL: ${MAGIC_LINK_TTL}
      JWT_TTL: ${JWT_TTL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phrasely
      POSTGRES_USER: phrasely
      POSTGRES_PASSWORD: phrasely
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phrasely"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
