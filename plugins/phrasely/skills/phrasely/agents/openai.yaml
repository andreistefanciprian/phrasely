interface:
  display_name: "Phrasely"
  short_description: "Understand, save, and practise English phrases"
  default_prompt: "Use $phrasely to explain, save, or practise an English expression."

dependencies:
  tools:
    - type: "mcp"
      value: "phrasely"
      description: "Phrasely MCP tools for the user's private phrase collection"
      transport: "streamable_http"
      url: "https://mcp.getphrasely.com/mcp"

policy:
  allow_implicit_invocation: true
